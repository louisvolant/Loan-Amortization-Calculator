<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- full-bleed gradient background (PWA / apple-touch-icon safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- subtle top-left glint for depth -->
  <ellipse cx="140" cy="90" rx="300" ry="240" fill="#ffffff" opacity="0.10"/>
  <!-- soft shadow under the calculator card -->
  <rect x="96" y="94" width="320" height="352" rx="72" fill="#1e3a8a" opacity="0.18"/>
  <!-- calculator body -->
  <rect x="96" y="80" width="320" height="352" rx="72" fill="#ffffff"/>
  <!-- display window -->
  <rect x="124" y="108" width="264" height="88" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <!-- amortization area fill under the curve -->
  <path d="M146 150 C 210 158, 280 170, 366 180 L146 180 Z" fill="#3b82f6" opacity="0.28"/>
  <!-- amortization curve (descending balance over time) -->
  <path d="M146 150 C 210 158, 280 170, 366 180" fill="none" stroke="url(#line)" stroke-width="9" stroke-linecap="round"/>
  <!-- chart baseline -->
  <path d="M146 180 H366" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- keypad row 1 -->
  <rect x="157" y="218" width="54" height="54" rx="16" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="3"/>
  <rect x="229" y="218" width="54" height="54" rx="16" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="3"/>
  <rect x="301" y="218" width="54" height="54" rx="16" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="3"/>
  <!-- keypad row 2 -->
  <rect x="157" y="290" width="54" height="54" rx="16" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="3"/>
  <rect x="229" y="290" width="54" height="54" rx="16" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="3"/>
  <rect x="301" y="290" width="54" height="54" rx="16" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="3"/>
  <!-- keypad row 3 -->
  <rect x="157" y="362" width="54" height="54" rx="16" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="3"/>
  <rect x="229" y="362" width="54" height="54" rx="16" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="3"/>
  <!-- accent key -->
  <rect x="301" y="362" width="54" height="54" rx="16" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
</svg>